[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upstate-ny-hyperspectral-mapping"
version = "0.1.0"
description = "Responsible hyperspectral surface mapping across New York's Finger Lakes and Lake Erie regions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Caroline Kamal", email = "carolinegkamal@gmail.com"}]
keywords = ["hyperspectral", "EMIT", "materials science", "remote sensing", "Finger Lakes", "machine learning"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
nasa = ["earthaccess>=0.12", "xarray>=2024.1", "h5netcdf>=1.3", "rasterio>=1.3"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
upstate-hyperspectral = "upstate_hyperspectral.cli:main"

[project.urls]
Portfolio = "https://carolinekamal.github.io"
Repository = "https://github.com/carolinekamal/upstate-ny-hyperspectral-mapping"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
